<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>弘文社 プライスカード作成</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>弘文社 プライスカード作成</h1>
      <p>商品写真・日本語名・英語名・価格を入力して、名刺サイズのカードを作成できます。</p>
    </div>
  </header>

  <main class="layout">
    <section class="panel controls">
      <h2>入力</h2>

      <label class="field">
        <span>商品写真</span>
        <input id="imageInput" type="file" accept="image/*" />
      </label>

      <div class="grid-2">
        <label class="field">
          <span>日本語商品名</span>
          <input id="jpName" type="text" value="陶器セット　桜" />
        </label>
        <label class="field">
          <span>英語商品名</span>
          <input id="enName" type="text" value="Ceramic Set – Sakura" />
        </label>
      </div>

      <div class="grid-3">
        <label class="field">
          <span>価格</span>
          <input id="price" type="number" min="0" step="1" value="3800" />
        </label>
        <label class="field">
          <span>税込表示</span>
          <select id="taxMode">
            <option value="tax">税込 / Tax included</option>
            <option value="none">表示なし</option>
          </select>
        </label>
        <label class="field">
          <span>デザイン</span>
          <select id="template">
            <option value="simple">シンプル</option>
            <option value="handwritten">手書き風</option>
          </select>
        </label>
      </div>

      <div class="grid-3">
        <label class="field">
          <span>カードサイズ</span>
          <select id="cardSize">
            <option value="business">名刺 91×55mm</option>
            <option value="a7">A7 105×74mm</option>
          </select>
        </label>
        <label class="field">
          <span>写真レイアウト</span>
          <select id="imageLayout">
            <option value="left">左：写真 / 右：文字</option>
            <option value="top">上：写真 / 下：文字</option>
          </select>
        </label>
        <label class="field">
          <span>写真表示</span>
          <select id="imageFit">
            <option value="contain">全体を表示</option>
            <option value="cover">カードいっぱい</option>
          </select>
        </label>
      </div>

      <div class="button-row">
        <button id="exportBtn" class="primary">PNG保存</button>
        <button id="printBtn">印刷</button>
        <button id="resetBtn">初期化</button>
      </div>

      <hr />
      <h2>商品登録（任意）</h2>
      <p class="hint">Firebaseを設定すると、商品情報をクラウド保存できます。未設定時はこの端末のブラウザに保存します。</p>
      <div class="button-row">
        <button id="saveProductBtn">現在の商品を登録</button>
        <button id="refreshProductsBtn">一覧更新</button>
      </div>
      <label class="field">
        <span>登録商品</span>
        <select id="productSelect"><option value="">選択してください</option></select>
      </label>
      <div id="status" class="status"></div>
    </section>

    <section class="panel preview-panel">
      <h2>プレビュー</h2>
      <div class="preview-shell">
        <canvas id="cardCanvas" aria-label="プライスカードプレビュー"></canvas>
      </div>
      <p class="hint">PNGは300dpi相当で書き出します。印刷時は「実際のサイズ / 100%」を推奨します。</p>
    </section>
  </main>

  <script src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
